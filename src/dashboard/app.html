<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest — Feature Board</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --text-muted: #8b949e; --text-dim: #484f58;
    --accent: #58a6ff; --green: #3fb950; --red: #f85149;
    --yellow: #d29922; --purple: #bc8cff;
    --high: #f85149; --medium: #d29922; --low: #8b949e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  .header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header h1 span { color: var(--accent); }
  .stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-muted); }
  .stats .num { font-weight: 600; color: var(--text); }
  .progress-bar { width: 120px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); transition: width 0.3s; }

  /* Tabs — primary navigation */
  .tab-bar { padding: 0 24px; display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab-bar button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 500; transition: color 0.15s, border-color 0.15s; }
  .tab-bar button:hover { color: var(--text); }
  .tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Toolbar — secondary controls per tab */
  .toolbar { padding: 8px 24px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); min-height: 44px; }
  .toolbar button, .toolbar select { background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .toolbar button:hover { border-color: var(--accent); color: var(--text); }
  .toolbar .active { background: var(--accent); color: #000; border-color: var(--accent); }
  .toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .toolbar label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .toolbar label input[type="checkbox"] { accent-color: var(--accent); }
  .search { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 5px; flex: 1; max-width: 260px; font-size: 12px; }
  .search:focus { outline: none; border-color: var(--accent); }

  /* Board */
  .board { display: flex; gap: 16px; padding: 16px 24px; overflow-x: auto; min-height: calc(100vh - 120px); align-items: flex-start; }
  .column { min-width: 320px; max-width: 320px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; max-height: calc(100vh - 140px); }
  .column-header { padding: 12px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface); border-radius: 8px 8px 0 0; z-index: 1; }
  .column-count { background: var(--border); padding: 2px 8px; border-radius: 10px; font-size: 12px; color: var(--text-muted); }
  .column-body { padding: 8px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }

  /* Cards */
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; cursor: pointer; transition: border-color 0.15s; }
  .card:hover { border-color: var(--accent); }
  .card.dragging { opacity: 0.5; }
  .card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .card-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 3px; background: var(--border); color: var(--text-muted); }
  .tag.high { background: rgba(248,81,73,0.15); color: var(--high); }
  .tag.medium { background: rgba(210,153,34,0.15); color: var(--medium); }
  .tag.low { background: rgba(139,148,158,0.15); color: var(--low); }
  .tag.cat { background: rgba(88,166,255,0.15); color: var(--accent); }
  .criteria-count { font-size: 11px; color: var(--text-dim); }

  /* List view */
  .list { padding: 16px 24px; }
  .list-row { display: grid; grid-template-columns: 32px 1fr 100px 80px 80px 60px; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); align-items: center; font-size: 13px; }
  .list-row:hover { background: var(--surface); }
  .list-header { font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.pass { background: var(--green); }
  .status-dot.fail { background: var(--red); }
  .status-dot.in-progress { background: var(--accent); }
  .status-dot.pending { background: var(--border); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 600px; max-height: 80vh; overflow-y: auto; padding: 24px; }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal textarea, .modal select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
  .modal-actions .primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .modal-actions .danger { background: transparent; color: var(--red); border-color: var(--red); }
  .deps-list { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .dep-tag { font-size: 11px; padding: 2px 6px; border-radius: 3px; background: rgba(188,140,255,0.15); color: var(--purple); }
</style>
</head>
<body>

<div class="header">
  <h1><span>Quest</span> Feature Board</h1>
  <div class="stats">
    <div><span class="num" id="stat-passing">0</span> passed</div>
    <div><span class="num" id="stat-inprogress">0</span> in-progress</div>
    <div><span class="num" id="stat-pending">0</span> pending</div>
    <div><span class="num" id="stat-failed">0</span> failed</div>
    <div><span class="num" id="stat-total">0</span> total</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span id="progress-pct">0%</span>
    </div>
  </div>
</div>

<div class="tab-bar">
  <button id="tab-features" class="active" onclick="setTab('features')">Features</button>
  <button id="tab-traces" onclick="setTab('traces')">Traces</button>
  <button id="tab-activity" onclick="setTab('activity')">Activity</button>
</div>

<div class="toolbar" id="features-toolbar">
  <button id="view-board" class="active" onclick="setView('board')">Board</button>
  <button id="view-list" onclick="setView('list')">List</button>
  <button id="view-dag" onclick="setView('dag')">DAG</button>
  <div class="sep"></div>
  <input class="search" id="search" placeholder="Search features..." oninput="render()">
  <select id="filter-priority" onchange="render()">
    <option value="">All priorities</option>
    <option value="high">High</option>
    <option value="medium">Medium</option>
    <option value="low">Low</option>
  </select>
  <select id="filter-category" onchange="render()"></select>
  <div style="flex:1"></div>
  <button onclick="openAddModal()">+ Add Feature</button>
</div>

<div class="toolbar" id="traces-toolbar" style="display:none">
  <select id="trace-agent-filter" onchange="loadTraces()">
    <option value="">All agents</option>
    <option value="coder">Coder</option>
    <option value="eval">Evaluator</option>
    <option value="init">Initializer</option>
  </select>
  <input class="search" id="trace-search" placeholder="Search by file path..." onkeydown="if(event.key==='Enter')searchTraces()">
  <button onclick="searchTraces()">Search</button>
  <div class="sep"></div>
  <button onclick="loadCostByAgent()">Cost by Agent</button>
  <button onclick="loadTopTools()">Top Tools</button>
  <div style="flex:1"></div>
  <label><input type="checkbox" id="full-capture-toggle" onchange="toggleFullCapture(this.checked)"> Full Capture</label>
</div>

<div class="toolbar" id="activity-toolbar" style="display:none">
  <select id="activity-filter" onchange="loadActivity()">
    <option value="">All events</option>
    <option value="feature_start,feature_done">Feature lifecycle</option>
    <option value="agent_start,agent_done">Agent sessions</option>
    <option value="tool_use">Tool calls</option>
    <option value="eval_verdict">Verdicts</option>
    <option value="context_reset">Context resets</option>
    <option value="run_start,run_complete">Run lifecycle</option>
  </select>
  <input class="search" id="activity-feature-filter" placeholder="Filter by feature ID..." oninput="loadActivity()">
  <div class="sep"></div>
  <button id="activity-auto" class="active" onclick="toggleAutoRefresh()">Auto-refresh</button>
  <button onclick="loadActivity()">Refresh</button>
  <button onclick="loadActivityCost()">Cost Summary</button>
</div>

<div id="features-panel">
  <div id="board-view" class="board"></div>
  <div id="list-view" class="list" style="display:none"></div>
  <div id="dag-view" style="display:none;padding:24px;overflow:auto"></div>
</div>
<div id="traces-panel" style="display:none">
  <div class="list" id="traces-content"></div>
  <!-- Session detail panel -->
  <div class="modal-overlay" id="trace-modal">
    <div class="modal" style="width:800px;max-height:90vh">
      <h2 id="trace-modal-title">Session Detail</h2>
      <div id="trace-meta" style="font-size:13px;color:var(--text-muted);margin-bottom:16px"></div>
      <div id="trace-events" style="font-family:'SF Mono',Menlo,monospace;font-size:12px;line-height:1.6;max-height:60vh;overflow-y:auto"></div>
      <div class="modal-actions">
        <button id="full-capture-btn" style="display:none;background:rgba(188,140,255,0.15);color:var(--purple);border-color:var(--purple)">View Full Capture</button>
        <button onclick="closeTraceModal()">Close</button>
      </div>
    </div>
  </div>
</div>
<div id="activity-panel" style="display:none">
  <div id="activity-summary" style="padding:12px 24px;display:flex;gap:24px;font-size:13px;color:var(--text-muted);border-bottom:1px solid var(--border)"></div>
  <div class="list" id="activity-content" style="max-height:calc(100vh - 200px);overflow-y:auto"></div>
</div>

<!-- Edit/Add Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Edit Feature</h2>
    <input type="hidden" id="modal-mode">
    <label>ID</label>
    <input id="f-id" placeholder="kebab-case-id">
    <label>Name</label>
    <input id="f-name" placeholder="Human-readable name">
    <label>Description</label>
    <textarea id="f-desc" placeholder="What this feature does"></textarea>
    <label>Category</label>
    <input id="f-cat" placeholder="e.g., api, auth, ui, testing">
    <label>Priority</label>
    <select id="f-pri">
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <label>Acceptance Criteria (one per line)</label>
    <textarea id="f-criteria" rows="5" placeholder="Each line is one criterion"></textarea>
    <label>Depends On (comma-separated feature IDs)</label>
    <input id="f-deps" placeholder="e.g., feature-a, feature-b">
    <div id="attempts-section" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:12px">
      <label style="margin-top:0;font-weight:600">Attempt History</label>
      <div id="attempts-list" style="font-size:12px;max-height:200px;overflow-y:auto;margin-top:8px"></div>
    </div>
    <div class="modal-actions">
      <button class="danger" id="btn-delete" onclick="deleteFeature()" style="display:none">Delete</button>
      <div style="flex:1"></div>
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveFeature()">Save</button>
    </div>
  </div>
</div>

<script>
let features = []
let view = 'board'
let editingId = null

async function load() {
  const [featRes, statsRes] = await Promise.all([
    fetch('/api/features'), fetch('/api/stats')
  ])
  features = await featRes.json()
  const stats = await statsRes.json()

  document.getElementById('stat-passing').textContent = stats.passing
  document.getElementById('stat-inprogress').textContent = stats.inProgress ?? 0
  document.getElementById('stat-pending').textContent = stats.pending
  document.getElementById('stat-failed').textContent = stats.failed ?? 0
  document.getElementById('stat-total').textContent = stats.total
  const pct = stats.total > 0 ? Math.round((stats.passing / stats.total) * 100) : 0
  document.getElementById('progress-fill').style.width = pct + '%'
  document.getElementById('progress-pct').textContent = pct + '%'

  // Populate category filter
  const catSelect = document.getElementById('filter-category')
  const currentCat = catSelect.value
  catSelect.innerHTML = '<option value="">All categories</option>'
  for (const cat of stats.categories) {
    catSelect.innerHTML += `<option value="${cat}" ${cat === currentCat ? 'selected' : ''}>${cat}</option>`
  }

  render()
}

function getFiltered() {
  const search = document.getElementById('search').value.toLowerCase()
  const priority = document.getElementById('filter-priority').value
  const category = document.getElementById('filter-category').value

  return features.filter(f => {
    if (search && !f.id.toLowerCase().includes(search) && !f.name.toLowerCase().includes(search) && !f.description.toLowerCase().includes(search)) return false
    if (priority && f.priority !== priority) return false
    if (category && f.category !== category) return false
    return true
  })
}

function render() {
  syncToURL()
  if (view === 'board') renderBoard()
  else if (view === 'dag') renderDAG()
  else renderList()
}

function getStatus(f) {
  if (f.status) return f.status
  if (f.passes) return 'passed'
  return 'pending'
}

function renderBoard() {
  const filtered = getFiltered()
  const columns = {
    'Pending': filtered.filter(f => getStatus(f) === 'pending'),
    'In Progress': filtered.filter(f => getStatus(f) === 'in_progress'),
    'Passed': filtered.filter(f => getStatus(f) === 'passed'),
    'Failed': filtered.filter(f => getStatus(f) === 'failed'),
    "Won't Do": filtered.filter(f => getStatus(f) === 'wont_do'),
  }

  const board = document.getElementById('board-view')

  // Save scroll positions of each column body before re-rendering
  const scrollPositions = new Map()
  const existingBodies = board.querySelectorAll('.column-body')
  existingBodies.forEach((body, i) => {
    scrollPositions.set(i, body.scrollTop)
  })

  board.innerHTML = ''

  let colIdx = 0
  for (const [title, items] of Object.entries(columns)) {
    const col = document.createElement('div')
    col.className = 'column'
    col.innerHTML = `
      <div class="column-header">
        ${title}
        <span class="column-count">${items.length}</span>
      </div>
      <div class="column-body">
        ${items.map(f => cardHTML(f)).join('')}
      </div>
    `
    board.appendChild(col)

    // Restore scroll position
    const savedScroll = scrollPositions.get(colIdx)
    if (savedScroll) {
      const body = col.querySelector('.column-body')
      if (body) body.scrollTop = savedScroll
    }
    colIdx++
  }
}

function cardHTML(f) {
  const deps = f.dependsOn?.length ? `<div class="deps-list">${f.dependsOn.map(d => `<span class="dep-tag">${d}</span>`).join('')}</div>` : ''
  const worker = f.worker_id ? `<span class="tag" style="background:rgba(210,153,34,0.15);color:var(--yellow)">W${f.worker_id}</span>` : ''
  return `
    <div class="card" onclick="openEditModal('${f.id}')">
      <div class="card-title">${esc(f.name)}</div>
      <div class="card-desc">${esc(f.description)}</div>
      <div class="card-meta">
        <span class="tag ${f.priority}">${f.priority}</span>
        <span class="tag cat">${f.category}</span>
        ${worker}
        <span class="criteria-count">${f.acceptanceCriteria.length} criteria</span>
      </div>
      ${deps}
    </div>
  `
}

function renderList() {
  const filtered = getFiltered()
  const list = document.getElementById('list-view')
  list.innerHTML = `
    <div class="list-row list-header">
      <div></div><div>Feature</div><div>Category</div><div>Priority</div><div>Status</div><div>Criteria</div>
    </div>
    ${filtered.map(f => `
      <div class="list-row" onclick="openEditModal('${f.id}')" style="cursor:pointer">
        <div><div class="status-dot ${f.passes ? 'pass' : 'pending'}"></div></div>
        <div>
          <div style="font-weight:500">${esc(f.name)}</div>
          <div style="font-size:11px;color:var(--text-dim)">${f.id}</div>
        </div>
        <div><span class="tag cat">${f.category}</span></div>
        <div><span class="tag ${f.priority}">${f.priority}</span></div>
        <div>${f.passes ? '<span style="color:var(--green)">Passed</span>' : '<span style="color:var(--text-muted)">Pending</span>'}</div>
        <div>${f.acceptanceCriteria.length}</div>
      </div>
    `).join('')}
  `
}

function setView(v) {
  view = v
  syncToURL()
  document.getElementById('board-view').style.display = v === 'board' ? 'flex' : 'none'
  document.getElementById('list-view').style.display = v === 'list' ? 'block' : 'none'
  document.getElementById('dag-view').style.display = v === 'dag' ? 'block' : 'none'
  document.getElementById('view-board').className = v === 'board' ? 'active' : ''
  document.getElementById('view-list').className = v === 'list' ? 'active' : ''
  document.getElementById('view-dag').className = v === 'dag' ? 'active' : ''
  render()
}

function openEditModal(id) {
  const f = features.find(x => x.id === id)
  if (!f) return
  editingId = id
  document.getElementById('modal-title').textContent = 'Edit Feature'
  document.getElementById('modal-mode').value = 'edit'
  document.getElementById('f-id').value = f.id
  document.getElementById('f-id').disabled = true
  document.getElementById('f-name').value = f.name
  document.getElementById('f-desc').value = f.description
  document.getElementById('f-cat').value = f.category
  document.getElementById('f-pri').value = f.priority
  document.getElementById('f-criteria').value = f.acceptanceCriteria.join('\n')
  document.getElementById('f-deps').value = (f.dependsOn || []).join(', ')
  document.getElementById('btn-delete').style.display = 'inline-block'
  document.getElementById('modal').classList.add('open')

  // Load attempt history
  const attemptsEl = document.getElementById('attempts-list')
  const attemptsSection = document.getElementById('attempts-section')
  fetch(`/api/features/${id}/attempts`).then(r => r.json()).then(attempts => {
    if (attempts.length === 0) {
      attemptsSection.style.display = 'none'
      return
    }
    attemptsSection.style.display = 'block'
    attemptsEl.innerHTML = attempts.map(a => {
      const dur = a.ended_at ? `${((a.ended_at - a.started_at) / 1000).toFixed(0)}s` : 'running'
      const verdictColor = a.verdict === 'pass' ? 'var(--green)' : a.verdict === 'fail' ? 'var(--red)' : 'var(--text-muted)'
      const worker = a.worker_id ? `W${a.worker_id}` : ''
      const tokens = a.input_tokens ? `${a.input_tokens}↑ ${a.output_tokens}↓` : ''
      const resets = a.context_resets ? `${a.context_resets} resets` : ''
      const evidence = a.eval_evidence ? `<div style="margin-top:4px;padding:4px 8px;background:var(--bg);border-radius:4px;color:var(--text-muted);white-space:pre-wrap;max-height:80px;overflow-y:auto">${esc(a.eval_evidence.slice(0, 500))}</div>` : ''
      const reason = a.failure_reason ? `<div style="color:var(--red);margin-top:2px">${esc(a.failure_reason.slice(0, 200))}</div>` : ''
      return `
        <div style="padding:8px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;background:var(--surface)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span><strong>#${a.attempt_num + 1}</strong> ${a.phase} ${worker}</span>
            <span style="display:flex;gap:8px;align-items:center">
              <span style="color:var(--text-dim)">${tokens} ${resets}</span>
              <span style="color:var(--text-dim)">${dur}</span>
              <span style="color:${verdictColor};font-weight:600">${a.verdict ?? '...'}</span>
            </span>
          </div>
          ${reason}${evidence}
        </div>
      `
    }).join('')
  })
}

function openAddModal() {
  editingId = null
  document.getElementById('modal-title').textContent = 'Add Feature'
  document.getElementById('modal-mode').value = 'add'
  document.getElementById('f-id').value = ''
  document.getElementById('f-id').disabled = false
  document.getElementById('f-name').value = ''
  document.getElementById('f-desc').value = ''
  document.getElementById('f-cat').value = ''
  document.getElementById('f-pri').value = 'medium'
  document.getElementById('f-criteria').value = ''
  document.getElementById('f-deps').value = ''
  document.getElementById('btn-delete').style.display = 'none'
  document.getElementById('modal').classList.add('open')
}

function closeModal() {
  document.getElementById('modal').classList.remove('open')
  editingId = null
}

async function saveFeature() {
  const mode = document.getElementById('modal-mode').value
  const data = {
    id: document.getElementById('f-id').value.trim(),
    name: document.getElementById('f-name').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    category: document.getElementById('f-cat').value.trim() || 'general',
    priority: document.getElementById('f-pri').value,
    acceptanceCriteria: document.getElementById('f-criteria').value.split('\n').map(s => s.trim()).filter(Boolean),
    dependsOn: document.getElementById('f-deps').value.split(',').map(s => s.trim()).filter(Boolean),
  }

  if (!data.id || !data.name) { alert('ID and Name are required'); return }

  if (mode === 'add') {
    await fetch('/api/features', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
  } else {
    await fetch(`/api/features/${editingId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
  }

  closeModal()
  await load()
}

async function deleteFeature() {
  if (!editingId) return
  if (!confirm(`Delete feature "${editingId}"?`)) return
  await fetch(`/api/features/${editingId}`, { method: 'DELETE' })
  closeModal()
  await load()
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

// ── Tab switching ─────────────────────────────────────────────────────

let activeTab = 'features'

function setTab(tab) {
  activeTab = tab
  syncToURL()
  for (const t of ['features', 'traces', 'activity']) {
    document.getElementById('tab-' + t).className = tab === t ? 'active' : ''
    const toolbar = document.getElementById(t + '-toolbar')
    if (toolbar) toolbar.style.display = tab === t ? 'flex' : 'none'
    document.getElementById(t + '-panel').style.display = tab === t ? 'block' : 'none'
  }
  if (tab === 'traces') loadTraces()
  if (tab === 'activity') loadActivity()
}

// ── URL state sync ────────────────────────────────────────────────────

function syncToURL() {
  const params = new URLSearchParams()
  params.set('tab', activeTab)
  if (activeTab === 'features') {
    params.set('view', view)
    const search = document.getElementById('search').value
    const pri = document.getElementById('filter-priority').value
    const cat = document.getElementById('filter-category').value
    if (search) params.set('q', search)
    if (pri) params.set('priority', pri)
    if (cat) params.set('category', cat)
  }
  history.replaceState(null, '', '#' + params.toString())
}

function loadFromURL() {
  const params = new URLSearchParams(location.hash.slice(1))
  const tab = params.get('tab')
  if (tab === 'traces' || tab === 'features' || tab === 'activity') setTab(tab)
  if (params.get('view')) setView(params.get('view'))
  if (params.get('q')) document.getElementById('search').value = params.get('q')
  if (params.get('priority')) document.getElementById('filter-priority').value = params.get('priority')
  // category filter is populated async after load, so defer
  setTimeout(() => {
    if (params.get('category')) document.getElementById('filter-category').value = params.get('category')
    render()
  }, 200)
}

// Restore state from URL on load
loadFromURL()

async function loadTraces() {
  const agent = document.getElementById('trace-agent-filter').value
  const params = agent ? `?agent=${agent}` : ''
  const res = await fetch(`/api/traces/sessions${params}`)
  const sessions = await res.json()
  renderTraceSessions(sessions)
}

function renderTraceSessions(sessions) {
  const el = document.getElementById('traces-content')
  // Filter to sessions with actual execution data (turns > 0 or completed/failed)
  const active = sessions.filter(s => s.turns > 0 || s.ended_at || s.input_tokens > 0)
  if (active.length === 0) {
    el.innerHTML = '<div style="padding:24px;color:var(--text-muted)">No trace sessions with execution history found. Run quest to generate traces.</div>'
    return
  }
  sessions = active
  el.innerHTML = `
    <div class="list-row list-header" style="grid-template-columns: 32px 1fr 100px 80px 120px 100px">
      <div></div><div>Session</div><div>Agent</div><div>Turns</div><div>Tokens</div><div>Duration</div>
    </div>
    ${sessions.map(s => {
      const endTs = s.ended_at || Date.now()
      const durSec = (endTs - s.started_at) / 1000
      const durStr = durSec < 60 ? `${durSec.toFixed(0)}s` : `${(durSec / 60).toFixed(1)}m`
      const dur = s.ended_at ? durStr : `${durStr} ⏳`
      const statusCls = s.status === 'completed' ? 'pass' : s.status === 'failed' ? 'fail' : s.status === 'running' ? 'in-progress' : 'pending'
      const agentColor = s.agent === 'coder' ? 'var(--accent)' : s.agent === 'eval' ? 'var(--purple)' : s.agent === 'init' ? 'var(--green)' : 'var(--text-muted)'
      const tokens = (s.input_tokens || s.output_tokens) ? `${s.input_tokens}↑ ${s.output_tokens}↓` : '—'
      return `
        <div class="list-row" style="grid-template-columns: 32px 1fr 100px 80px 120px 100px;cursor:pointer" onclick="openTraceSession('${s.session_id}')">
          <div><div class="status-dot ${statusCls}"></div></div>
          <div>
            <div style="font-weight:500">${esc(s.topic)}</div>
            <div style="font-size:11px;color:var(--text-dim)">${s.session_id}${s.feature_id ? ' | ' + s.feature_id : ''}</div>
          </div>
          <div><span style="color:${agentColor}">${s.agent}</span></div>
          <div>${s.turns || '—'}</div>
          <div style="font-size:12px">${tokens}</div>
          <div>${dur}</div>
        </div>
      `
    }).join('')}
  `
}

async function openTraceSession(sessionId) {
  const [sessionRes, eventsRes] = await Promise.all([
    fetch(`/api/traces/sessions/${sessionId}`),
    fetch(`/api/traces/sessions/${sessionId}/events`),
  ])
  const session = await sessionRes.json()
  const events = await eventsRes.json()

  const endTs = session.ended_at || Date.now()
  const durSec = (endTs - session.started_at) / 1000
  const durStr = durSec < 60 ? `${durSec.toFixed(1)}s` : `${(durSec / 60).toFixed(1)}m`
  const dur = session.ended_at ? durStr : `${durStr} (still running)`
  const tokens = (session.input_tokens || session.output_tokens) ? `${session.input_tokens}↑ ${session.output_tokens}↓` : 'no token data'
  document.getElementById('trace-modal-title').textContent = session.topic
  document.getElementById('trace-meta').innerHTML = `
    <strong>${session.agent}</strong> | Model: ${session.model} | ${session.turns || 0} turns | ${tokens} | ${dur} | ${session.status}
    ${session.feature_id ? `| Feature: ${session.feature_id}` : ''}
    ${session.worker_id ? `| Worker: W${session.worker_id}` : ''}
  `

  const lines = events.map(e => {
    const time = new Date(e.ts).toISOString().split('T')[1]?.split('.')[0] ?? ''
    switch (e.type) {
      case 'system_init': return `<span style="color:var(--text-dim)">[${time}] SESSION INIT</span>`
      case 'tool_call': {
        const file = e.file_path ? ` <span style="color:var(--accent)">${esc(e.file_path)}</span>` : ''
        let detail = ''
        if (e.tool_name === 'Bash' && e.input_json) {
          try { const o = JSON.parse(e.input_json); if (o.command) detail = `\n  <span style="color:var(--text-muted)">$ ${esc(o.command.slice(0,120))}</span>` } catch {}
        }
        return `<span style="color:var(--yellow)">[${time}] ${e.tool_name}</span>${file}${detail}`
      }
      case 'assistant_text': {
        const preview = (e.content_text || '').slice(0, 200)
        return `<span style="color:var(--green)">[${time}] TEXT:</span> <span style="color:var(--text-muted)">${esc(preview)}${(e.content_text || '').length > 200 ? '...' : ''}</span>`
      }
      case 'result': {
        const status = e.is_error ? '<span style="color:var(--red)">ERROR</span>' : '<span style="color:var(--green)">OK</span>'
        const tokens = e.input_tokens != null ? ` | ${e.input_tokens}↑ ${e.output_tokens}↓` : ''
        return `<span style="color:var(--text)">[${time}] RESULT: ${status}${tokens}</span>`
      }
      default: return `<span style="color:var(--text-dim)">[${time}] ${e.type}</span>`
    }
  })

  document.getElementById('trace-events').innerHTML = lines.join('\n')

  // Check for full-capture data and show button if available
  const fcBtn = document.getElementById('full-capture-btn')
  fcBtn.style.display = 'none'
  fcBtn.onclick = () => showFullCapture(sessionId)
  fetch(`/api/full-capture/${sessionId}`).then(r => {
    if (r.ok) fcBtn.style.display = 'inline-block'
  }).catch(() => {})

  document.getElementById('trace-modal').classList.add('open')
}

async function showFullCapture(sessionId) {
  const res = await fetch(`/api/full-capture/${sessionId}`)
  if (!res.ok) return
  const entries = await res.json()
  const el = document.getElementById('trace-events')
  el.innerHTML = entries.map(e => {
    const time = new Date(e.ts).toISOString().split('T')[1]?.split('.')[0] ?? ''
    const typeColor = e.type === 'sdk_message' ? 'var(--accent)' : e.type === 'api_call' ? 'var(--purple)' : 'var(--text-dim)'
    const contentStr = typeof e.content === 'string' ? e.content : JSON.stringify(e.content, null, 2)

}

// ── DAG View ──────────────────────────────────────────────────────────

function renderDAG() {
  const el = document.getElementById('dag-view')
  const filtered = getFiltered()

  // Build dependency graph and compute levels
  const nodeMap = new Map()
  for (const f of filtered) {
    nodeMap.set(f.id, { ...f, level: 0, deps: f.dependsOn || [], dependents: [] })
  }
  // Wire dependents
  for (const [id, node] of nodeMap) {
    for (const depId of node.deps) {
      const parent = nodeMap.get(depId)
      if (parent) parent.dependents.push(id)
    }
  }
  // Compute levels (topological)
  const visited = new Set()
  function computeLevel(id) {
    if (visited.has(id)) return nodeMap.get(id)?.level ?? 0
    visited.add(id)
    const node = nodeMap.get(id)
    if (!node) return 0
    if (node.deps.length === 0) { node.level = 0; return 0 }
    let maxDep = 0
    for (const d of node.deps) {
      maxDep = Math.max(maxDep, computeLevel(d) + 1)
    }
    node.level = maxDep
    return maxDep
  }
  for (const id of nodeMap.keys()) computeLevel(id)

  // Group by level
  const levels = new Map()
  for (const [id, node] of nodeMap) {
    if (!levels.has(node.level)) levels.set(node.level, [])
    levels.get(node.level).push(node)
  }
  const maxLevel = Math.max(...levels.keys(), 0)

  // Status colors
  const statusColor = { pending: 'var(--border)', in_progress: 'var(--yellow)', passed: 'var(--green)', failed: 'var(--red)', wont_do: 'var(--text-dim)' }
  const statusBg = { pending: 'var(--surface)', in_progress: 'rgba(210,153,34,0.1)', passed: 'rgba(63,185,80,0.1)', failed: 'rgba(248,81,73,0.1)', wont_do: 'rgba(72,79,88,0.1)' }

  // Layout constants
  const nodeW = 200, nodeH = 60, gapX = 80, gapY = 20, padX = 40, padY = 40

  // Compute positions
  const positions = new Map()
  for (let lvl = 0; lvl <= maxLevel; lvl++) {
    const nodes = levels.get(lvl) || []
    const x = padX + lvl * (nodeW + gapX)
    for (let i = 0; i < nodes.length; i++) {
      const y = padY + i * (nodeH + gapY)
      positions.set(nodes[i].id, { x, y, node: nodes[i] })
    }
  }

  const totalW = padX * 2 + (maxLevel + 1) * (nodeW + gapX)
  const maxNodesInLevel = Math.max(...Array.from(levels.values()).map(n => n.length), 1)
  const totalH = padY * 2 + maxNodesInLevel * (nodeH + gapY)

  // Render SVG
  let svg = `<svg width="${totalW}" height="${totalH}" style="min-width:${totalW}px">`

  // Draw edges first (behind nodes)
  for (const [id, pos] of positions) {
    const node = pos.node
    for (const depId of node.deps) {
      const depPos = positions.get(depId)
      if (!depPos) continue
      const x1 = depPos.x + nodeW, y1 = depPos.y + nodeH / 2
      const x2 = pos.x, y2 = pos.y + nodeH / 2
      const cx = (x1 + x2) / 2
      const depStatus = getStatus(depPos.node)
      const edgeColor = depStatus === 'passed' ? 'var(--green)' : 'var(--border)'
      svg += `<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}" fill="none" stroke="${edgeColor}" stroke-width="2" opacity="0.5"/>`
      // Arrowhead
      svg += `<polygon points="${x2},${y2} ${x2 - 8},${y2 - 4} ${x2 - 8},${y2 + 4}" fill="${edgeColor}" opacity="0.5"/>`
    }
  }

  // Draw nodes
  for (const [id, pos] of positions) {
    const node = pos.node
    const status = getStatus(node)
    const borderColor = statusColor[status] || 'var(--border)'
    const bg = statusBg[status] || 'var(--surface)'
    const priColor = node.priority === 'high' ? 'var(--high)' : node.priority === 'medium' ? 'var(--medium)' : 'var(--low)'
    const workerLabel = node.worker_id ? `W${node.worker_id}` : ''

    svg += `
      <g style="cursor:pointer" onclick="openEditModal('${id}')">
        <rect x="${pos.x}" y="${pos.y}" width="${nodeW}" height="${nodeH}" rx="6" fill="${bg}" stroke="${borderColor}" stroke-width="2"/>
        <text x="${pos.x + 8}" y="${pos.y + 18}" fill="var(--text)" font-size="12" font-weight="500">${esc(node.name.slice(0, 24))}${node.name.length > 24 ? '...' : ''}</text>
        <text x="${pos.x + 8}" y="${pos.y + 34}" fill="var(--text-muted)" font-size="10">${id}</text>
        <text x="${pos.x + 8}" y="${pos.y + 50}" fill="${priColor}" font-size="10">${node.priority}</text>
        <text x="${pos.x + nodeW - 8}" y="${pos.y + 50}" fill="var(--text-dim)" font-size="10" text-anchor="end">${status}${workerLabel ? ' ' + workerLabel : ''}</text>
      </g>
    `
  }

  svg += '</svg>'

  // Level labels
  let levelLabels = '<div style="display:flex;gap:' + (nodeW + gapX - 50) + 'px;padding-left:' + padX + 'px;margin-bottom:8px">'
  for (let i = 0; i <= maxLevel; i++) {
    const count = (levels.get(i) || []).length
    levelLabels += `<div style="width:${nodeW}px;font-size:12px;color:var(--text-muted)">Level ${i} <span style="color:var(--text-dim)">(${count})</span></div>`
  }
  levelLabels += '</div>'

  el.innerHTML = `
    <div style="margin-bottom:16px;color:var(--text-muted);font-size:13px">
      ${nodeMap.size} features, ${maxLevel + 1} levels, max parallelism: ${maxNodesInLevel}
    </div>
    ${levelLabels}
    <div style="overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg)">
      ${svg}
    </div>
  `
}

// ── Activity Tab ──────────────────────────────────────────────────────

let activityAutoRefresh = true
let activityCursor = 0
let activityTimer = null

function toggleAutoRefresh() {
  activityAutoRefresh = !activityAutoRefresh
  document.getElementById('activity-auto').className = activityAutoRefresh ? 'active' : ''
  if (activityAutoRefresh) startActivityPoll()
  else stopActivityPoll()
}

function startActivityPoll() {
  stopActivityPoll()
  if (!activityAutoRefresh) return
  activityTimer = setInterval(() => {
    if (activeTab === 'activity') pollActivity()
  }, 2000)
}

function stopActivityPoll() {
  if (activityTimer) { clearInterval(activityTimer); activityTimer = null }
}

async function loadActivity() {
  activityCursor = 0
  const res = await fetch('/api/events')
  const events = await res.json()
  if (!Array.isArray(events)) { renderActivityEvents([]); return }
  renderActivityEvents(events)
  // Set cursor to the latest
  const statsRes = await fetch('/api/events/stats')
  const stats = await statsRes.json()
  activityCursor = stats.total ?? 0
  startActivityPoll()
}

async function pollActivity() {
  try {
    const res = await fetch(`/api/events?after=${activityCursor}`)
    const data = await res.json()
    if (data.events && data.events.length > 0) {
      activityCursor = data.lastId
      appendActivityEvents(data.events)
    }
  } catch { /* ignore poll errors */ }
}

function fmtTime(ts) {
  if (!ts) return ''
  try { return new Date(ts).toISOString().split('T')[1]?.split('.')[0] ?? '' } catch { return '' }
}

function fmtDuration(ms) {
  if (!ms) return ''
  if (ms < 1000) return ms + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's'
  return Math.floor(ms / 60000) + 'm' + Math.floor((ms % 60000) / 1000) + 's'
}

function eventIcon(type) {
  const icons = {
    run_start: '<span style="color:var(--accent)">&#9654;</span>',
    run_complete: '<span style="color:var(--green)">&#9632;</span>',
    feature_start: '<span style="color:var(--yellow)">&#9655;</span>',
    feature_done: '',
    agent_start: '<span style="color:var(--accent)">&#9679;</span>',
    agent_done: '<span style="color:var(--text-muted)">&#9675;</span>',
    tool_use: '<span style="color:var(--text-dim)">&#8226;</span>',
    eval_verdict: '',
    context_reset: '<span style="color:var(--yellow)">&#8635;</span>',
    dag_built: '<span style="color:var(--purple)">&#9670;</span>',
    batch_plan: '<span style="color:var(--text-dim)">&#9633;</span>',
    feature_unblocked: '<span style="color:var(--green)">&#8599;</span>',
    shutdown: '<span style="color:var(--red)">&#9632;</span>',
    init_failed: '<span style="color:var(--red)">&#10007;</span>',
  }
  return icons[type] || '<span style="color:var(--text-dim)">&#8226;</span>'
}

function renderEventRow(e) {
  const time = fmtTime(e.ts)
  const worker = e.workerId ? `<span style="color:var(--text-dim)">W${e.workerId}</span> ` : ''

  switch (e.type) {
    case 'run_start':
      return `<div style="color:var(--accent);font-weight:500">[${time}] ${eventIcon(e.type)} RUN START — ${esc(e.projectName)} (${e.total} features${e.concurrency ? ', ' + e.concurrency + ' workers' : ''})</div>`
    case 'run_complete':
      return `<div style="color:var(--green);font-weight:500">[${time}] ${eventIcon(e.type)} RUN COMPLETE — ${e.passing}/${e.total} passed in ${fmtDuration(e.durationMs)}${e.totalCostUsd ? ' ($' + e.totalCostUsd.toFixed(2) + ')' : ''}</div>`
    case 'feature_start':
      return `<div>[${time}] ${eventIcon(e.type)} ${worker}<span style="color:var(--yellow)">FEATURE START</span> <span style="font-weight:500">${esc(e.featureId)}</span> <span style="color:var(--text-dim)">[${e.priority}] ${e.index}/${e.total}</span></div>`
    case 'feature_done': {
      const color = e.verdict === 'pass' ? 'var(--green)' : 'var(--red)'
      const icon = e.verdict === 'pass' ? '&#10003;' : '&#10007;'
      return `<div>[${time}] <span style="color:${color}">${icon}</span> ${worker}<span style="color:${color}">FEATURE ${e.verdict.toUpperCase()}</span> <span style="font-weight:500">${esc(e.featureId)}</span> <span style="color:var(--text-dim)">attempt ${e.attempt} ${fmtDuration(e.durationMs)}${e.failureCategory ? ' [' + e.failureCategory + ']' : ''}</span></div>`
    }
    case 'agent_start':
      return `<div style="color:var(--text-muted)">[${time}] ${eventIcon(e.type)} ${worker}<span style="color:${e.agent === 'coder' ? 'var(--accent)' : 'var(--purple)'}">${e.agent}</span> started${e.featureId ? ' for ' + e.featureId : ''}${e.resetCount ? ' (reset #' + e.resetCount + ')' : ''}${e.model ? ' [' + e.model + ']' : ''}</div>`
    case 'agent_done': {
      const dur = fmtDuration(e.durationMs)
      const tokens = e.inputTokens ? ` ${e.inputTokens}in/${e.outputTokens}out` : ''
      return `<div style="color:var(--text-muted)">[${time}] ${eventIcon(e.type)} ${worker}<span style="color:${e.agent === 'coder' ? 'var(--accent)' : 'var(--purple)'}">${e.agent}</span> done — ${e.turns} turns ${dur}${tokens} ${e.success ? '<span style="color:var(--green)">OK</span>' : '<span style="color:var(--red)">ERR</span>'}</div>`
    }
    case 'tool_use':
      return `<div style="color:var(--text-dim);padding-left:16px">[${time}] ${eventIcon(e.type)} ${worker}<span style="color:var(--yellow)">${esc(e.tool)}</span> <span style="color:var(--text-dim)">${esc((e.summary || '').slice(0, 80))}</span></div>`
    case 'eval_verdict': {
      const vColor = e.verdict === 'pass' ? 'var(--green)' : 'var(--red)'
      const results = (e.criteriaResults || []).map(cr =>
        `<div style="padding-left:32px;color:${cr.result === 'pass' ? 'var(--green)' : 'var(--red)'}">  ${cr.result === 'pass' ? '&#10003;' : '&#10007;'} ${esc(cr.criterion.slice(0, 80))}</div>`
      ).join('')
      return `<div>[${time}] <span style="color:${vColor};font-weight:500">VERDICT: ${e.verdict.toUpperCase()}</span> ${esc(e.featureId)}</div>${results}`
    }
    case 'context_reset':
      return `<div style="color:var(--yellow)">[${time}] ${eventIcon(e.type)} ${worker}CONTEXT RESET #${e.resetCount} for ${esc(e.featureId)} (${e.completedCount} done, ${e.remainingCount} remaining)</div>`
    case 'dag_built':
      return `<div style="color:var(--purple)">[${time}] ${eventIcon(e.type)} DAG: ${e.levels} levels, max parallelism ${e.maxParallelism}, critical path: ${(e.criticalPath || []).slice(0, 3).join(' → ')}${(e.criticalPath || []).length > 3 ? '...' : ''}</div>`
    case 'batch_plan':
      return `<div style="color:var(--text-dim)">[${time}] ${eventIcon(e.type)} BATCH: ${e.dispatching} dispatching (${e.ready} ready, ${e.inFlight} in-flight) — ${esc(e.reason || '')}</div>`
    case 'feature_unblocked':
      return `<div style="color:var(--green)">[${time}] ${eventIcon(e.type)} UNBLOCKED: ${esc(e.featureId)} (by ${esc(e.unblockedBy)})</div>`
    case 'shutdown':
      return `<div style="color:var(--red)">[${time}] ${eventIcon(e.type)} SHUTDOWN: ${esc(e.featureId)} — ${esc(e.reason)}</div>`
    case 'init_failed':
      return `<div style="color:var(--red)">[${time}] ${eventIcon(e.type)} INIT FAILED attempt ${e.attempt} (exit ${e.exitCode})</div>`
    default:
      return `<div style="color:var(--text-dim)">[${time}] ${e.type}${e.featureId ? ' ' + e.featureId : ''}</div>`
  }
}

function filterActivityEvents(events) {
  const typeFilter = document.getElementById('activity-filter').value
  const featureFilter = document.getElementById('activity-feature-filter').value.trim().toLowerCase()

  let filtered = events
  if (typeFilter) {
    const types = typeFilter.split(',')
    filtered = filtered.filter(e => types.includes(e.type))
  }
  if (featureFilter) {
    filtered = filtered.filter(e => (e.featureId || '').toLowerCase().includes(featureFilter))
  }
  return filtered
}

function renderActivityEvents(events) {
  const filtered = filterActivityEvents(events)
  const el = document.getElementById('activity-content')

  // Summary
  const summary = document.getElementById('activity-summary')
  const total = events.length
  const features = new Set(events.filter(e => e.featureId).map(e => e.featureId)).size
  const passes = events.filter(e => e.type === 'feature_done' && e.verdict === 'pass').length
  const fails = events.filter(e => e.type === 'feature_done' && e.verdict === 'fail').length
  const resets = events.filter(e => e.type === 'context_reset').length
  summary.innerHTML = `
    <span><span class="num">${total}</span> events</span>
    <span><span class="num">${features}</span> features</span>
    <span style="color:var(--green)"><span class="num">${passes}</span> passed</span>
    <span style="color:var(--red)"><span class="num">${fails}</span> failed</span>
    ${resets > 0 ? `<span style="color:var(--yellow)"><span class="num">${resets}</span> resets</span>` : ''}
  `

  if (filtered.length === 0) {
    el.innerHTML = '<div style="padding:24px;color:var(--text-muted)">No events found. Run quest to generate activity data.</div>'
    return
  }

  // Show most recent events first (reversed), limit to 500 for performance
  const display = filtered.slice(-500).reverse()
  el.innerHTML = '<div style="font-family:\'SF Mono\',Menlo,monospace;font-size:12px;line-height:1.8;padding:8px 0">' +
    display.map(renderEventRow).join('') + '</div>'
}

function appendActivityEvents(newEvents) {
  const el = document.getElementById('activity-content')
  const container = el.querySelector('div')
  if (!container) { renderActivityEvents(newEvents); return }

  const filtered = filterActivityEvents(newEvents)
  if (filtered.length === 0) return

  // Prepend new events (newest first)
  const html = filtered.reverse().map(renderEventRow).join('')
  container.insertAdjacentHTML('afterbegin', html)

  // Update summary counts
  loadActivitySummary()
}

async function loadActivitySummary() {
  try {
    const res = await fetch('/api/events/stats')
    const stats = await res.json()
    const summary = document.getElementById('activity-summary')
    summary.innerHTML = `<span><span class="num">${stats.total}</span> events</span>` +
      (stats.byType || []).filter(t => ['feature_done', 'context_reset', 'agent_done'].includes(t.type))
        .map(t => `<span><span class="num">${t.count}</span> ${t.type.replace('_', ' ')}</span>`).join('')
  } catch { /* ignore */ }
}

async function loadActivityCost() {
  const res = await fetch('/api/events')
  const events = await res.json()
  if (!Array.isArray(events)) return

  // Calculate cost from agent_done events
  const byAgent = {}
  for (const e of events) {
    if (e.type !== 'agent_done') continue
    const key = e.agent || 'unknown'
    if (!byAgent[key]) byAgent[key] = { agent: key, sessions: 0, inputTokens: 0, outputTokens: 0, cacheReadTokens: 0, durationMs: 0 }
    byAgent[key].sessions++
    byAgent[key].inputTokens += e.inputTokens || 0
    byAgent[key].outputTokens += e.outputTokens || 0
    byAgent[key].cacheReadTokens += e.cacheReadTokens || 0
    byAgent[key].durationMs += e.durationMs || 0
  }

  const el = document.getElementById('activity-content')
  const rows = Object.values(byAgent)
  if (rows.length === 0) { el.innerHTML = '<div style="padding:24px;color:var(--text-muted)">No agent data yet.</div>'; return }
  el.innerHTML = `
    <div class="list-row list-header" style="grid-template-columns: 100px 80px 120px 120px 120px 100px">
      <div>Agent</div><div>Sessions</div><div>Input Tokens</div><div>Output Tokens</div><div>Cache Read</div><div>Duration</div>
    </div>
    ${rows.map(r => `
      <div class="list-row" style="grid-template-columns: 100px 80px 120px 120px 120px 100px">
        <div style="font-weight:500;color:${r.agent === 'coder' ? 'var(--accent)' : r.agent === 'eval' ? 'var(--purple)' : 'var(--text)'}">${r.agent}</div>
        <div>${r.sessions}</div>
        <div>${r.inputTokens.toLocaleString()}</div>
        <div>${r.outputTokens.toLocaleString()}</div>
        <div>${r.cacheReadTokens.toLocaleString()}</div>
        <div>${fmtDuration(r.durationMs)}</div>
      </div>
    `).join('')}
  `
}

// ── Auto-refresh (live status updates from agents) ────────────────────

let autoRefreshInterval = null

function startAutoRefresh() {
  if (autoRefreshInterval) return
  autoRefreshInterval = setInterval(load, 3000) // poll every 3 seconds
}

function stopAutoRefresh() {
  if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null }
}

// Auto-refresh when on features tab (agents may be updating status)
startAutoRefresh()

// Close modals on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeTraceModal() } })
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal() })
document.getElementById('trace-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeTraceModal() })

load()
initFullCaptureToggle()
</script>
